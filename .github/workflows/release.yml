name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y gnome-shell nodejs libglib2.0-bin
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify release version
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Test and package
        run: ./scripts/check.sh && ./scripts/pack-deb.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/simpleclipboard_amd64.deb
          --draft
          --generate-notes
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
